name: Günlük altın
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/update-gold.mjs
      - name: Değiştiyse kaydet ve gönder
        run: |
          if ! git diff --quiet -- gold/history.json; then
            day=$(node -p "JSON.parse(require('fs').readFileSync('gold/history.json')).updated")
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add gold/history.json
            git commit -m "altın: $day"
            git push
          fi
